name: Production Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm test
        env:
          SESSION_SECRET: ci_session_secret_with_at_least_32_characters
      - run: npm run build
      - run: docker build --tag futhing:${{ github.sha }} .
