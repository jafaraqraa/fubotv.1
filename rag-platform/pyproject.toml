[project]
name = "rag-platform"
version = "1.0.0"
description = "Standalone Production-Grade RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "qdrant-client>=1.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["evaluation/*.json"]
